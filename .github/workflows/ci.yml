name: CI/CD Pipeline (Docker + K8s + Git push)
on:
  push:
    branches: [ DevOps, develop ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: vaibhs123/bankapp
  DOCKER_TAG: v${{ github.run_number }}

permissions:
  contents: write  # Git push के लिए

jobs:
  ci-cd:
    runs-on: [self-hosted]  # ARC runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Git history के लिए

      - name: Set up Docker Buildx  # ✅ FIX ADDED
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile  # Explicit
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64  # Single arch for speed

      - name: Verify & Update Kubernetes manifest
        run: |
          if [ ! -f "kubernetes/bankapp-deployment.yml" ]; then
            echo "❌ Manifest file not found!"
            find . -name "*deployment*.yml" -o -name "*deployment*.yaml" || echo "No deployment files found"
            exit 1
          fi
          
          echo "📋 Before SED:"
          grep -n 'image:' kubernetes/bankapp-deployment.yml || echo "No image field found"
          
          sed -i "s|image: vaibhs123/bankapp:[^[:space:]]*/?|image: vaibhs123/bankapp:${{ env.DOCKER_TAG }}|g" kubernetes/bankapp-deployment.yml
          
          echo "✅ After SED:"
          grep -n 'image:' kubernetes/bankapp-deployment.yml

      - name: Commit and push updated manifest
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          git add kubernetes/bankapp-deployment.yml
          if git diff --staged --quiet; then
            echo "✅ No image changes needed"
          else
            git commit -m "chore: update deployment image to ${{ env.DOCKER_TAG }} [skip ci]"
            git push origin HEAD:DevOps
            echo "✅ Pushed manifest update"
          fi

