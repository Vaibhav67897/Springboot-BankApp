name: CI/CD Pipeline (Docker + K8s + Git push)

on:
  push:
    branches: [ DevOps, develop ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: vaibhs123/bankapp
  DOCKER_TAG: v${{ github.run_number }}

jobs:
  # 1) Cleanup job (optional, simple)
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup workspace
        run: rm -rf *

  # 2) Build & push Docker image (NO dind)
  build-image:
    needs: cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} .
          docker push ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

  # 3) Update Kubernetes manifest file
  update-k8s-manifest:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Kubernetes manifest
        run: |
          sudo apt-get update
          sudo apt-get install -y sed grep
          echo "Before SED:"
          grep 'image:' kubernetes/bankapp-deployment.yml || true
          sed -i -e "s|vaibhs123/bankapp:.*|vaibhs123/bankapp:${{ env.DOCKER_TAG }}|g" kubernetes/bankapp-deployment.yml
          echo "After SED:"
          grep 'image:' kubernetes/bankapp-deployment.yml || true

  # 4) Commit & push updated manifest to DevOps branch
  git-push:
    needs: update-k8s-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DevOps branch
        uses: actions/checkout@v4
        with:
          ref: DevOps
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

      - name: Commit and push updated manifest
        run: |
          git add kubernetes/bankapp-deployment.yml || true
          git commit -m "Updated Docker image version to ${{ env.DOCKER_TAG }}" || echo "Nothing to commit"
          git push origin DevOps
