name: CI/CD Pipeline (Docker + K8s + Git push)

on:
  push:
    branches: [ DevOps, develop ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: vaibhs123/bankapp
  DOCKER_TAG: v${{ github.run_number }}

permissions:
  contents: write  # Git push के लिए

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Git history के लिए

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Verify & Update Kubernetes manifest
        run: |
          if [ ! -f "kubernetes/bankapp-deployment.yml" ]; then
            echo "❌ Manifest file not found!"
            ls -la kubernetes/ || echo "No kubernetes folder"
            exit 1
          fi
          
          echo "📋 Before SED:"
          grep -n 'image:' kubernetes/bankapp-deployment.yml
          
          # Exact line replace (non-greedy, first occurrence)
          sed -i "s|image: vaibhs123/bankapp:[^[:space:]]*|image: vaibhs123/bankapp:${{ env.DOCKER_TAG }}|g" kubernetes/bankapp-deployment.yml
          
          echo "✅ After SED:"
          grep -n 'image:' kubernetes/bankapp-deployment.yml
          echo "Updated to ${{ env.DOCKER_TAG }}"

      - name: Commit and push updated manifest
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          git add kubernetes/bankapp-deployment.yml
          git commit -m "chore: update image to ${{ env.DOCKER_TAG }} [skip ci]" || echo "✅ No changes or up-to-date"
          git push origin HEAD:DevOps
